# Baut die Windows-Version und veröffentlicht sie als GitHub-Release.
# Auslöser: neue Versionsnummer in package.json auf main – die installierten Apps holen sich das Update dann selbst.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schon veröffentlicht?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$V existiert bereits"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Abhängigkeiten
        if: steps.check.outputs.skip != 'true'
        run: npm install
      - name: Selbsttest Spracherkennung (Windows)
        if: steps.check.outputs.skip != 'true'
        run: node -e "const s=require('sherpa-onnx-node'); console.log('sherpa ok', typeof s.OfflineRecognizer)"
      - name: Bauen und veröffentlichen
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
